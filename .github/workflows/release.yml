name: Build and Publish EngiStore Pro

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Company & Security UI update
        run: node scripts/apply-company-security-update.js

      - name: Sync patched UI back to main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No UI source changes to commit."
          else
            git commit -m "Update Company & Security and User Management for v2.5.3"
            git push origin HEAD:main
          fi

      - name: Validate source
        run: npm run lint

      - name: Build Windows installer
        run: npm run dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Publishing version: $VERSION"
          echo "Release tag: $TAG"
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml --title "EngiStore Pro v$VERSION" --generate-notes
